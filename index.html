<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Building 2026</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: center; 
        }

        .main-container {
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 80px; 
            width: 90%;
            max-width: 1600px;
            padding: 40px 20px;
        }

        .photo-side {
            flex: 1.2;
            display: flex;
            justify-content: flex-end;
        }

        .photo-side img {
            width: 100%; 
            max-width: 850px; 
            height: auto;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            display: block;
        }

        .content-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }

        .ui-wrapper {
            display: flex;
            flex-direction: column;
            width: fit-content;
        }

        /* Общий стиль для заголовка и подписи */
        h1, .footer-text {
            font-size: clamp(2rem, 5vw, 3.8rem); 
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f8fafc;
            white-space: nowrap; 
            line-height: 1;
            text-align: center;
            margin: 0;
            font-weight: bold;
        }

        h1 { margin-bottom: 80px; } /* Отступ вниз до кнопок */

        .lang-select { 
            display: flex; 
            justify-content: space-between; 
            gap: 25px;
            margin-bottom: 80px; /* Отступ вниз до Epsilons */
        }
        
        .btn { 
            padding: 22px 35px; 
            border: 2px solid #6366f1; 
            border-radius: 14px; 
            text-decoration: none; 
            color: white; 
            font-weight: bold; 
            transition: 0.4s; 
            font-size: clamp(1.1rem, 2vw, 1.5rem); 
            min-width: 150px;
            text-align: center;
            flex: 1;
        }

        .btn:hover { 
            background: #6366f1; 
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
        }

        @media (max-width: 1100px) {
            body { overflow-y: auto; }
            .main-container { flex-direction: column; gap: 50px; padding: 60px 20px; }
            .photo-side { justify-content: center; width: 100%; }
            .photo-side img { max-width: 90%; }
            .content-side { align-items: center; width: 100%; }
            h1, .lang-select { margin-bottom: 50px; }
            .ui-wrapper { width: 95%; max-width: 600px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="photo-side">
            <img src="logo.jpg" alt="Team Building Photo">
        </div>

        <div class="content-side">
            <div class="ui-wrapper">
                <h1>Team building 2026</h1>
                
                <div class="lang-select">
                    <a href="lv/menu.html" class="btn">LATVIEŠU</a>
                    <a href="ru/menu.html" class="btn">РУССКИЙ</a>
                </div>

                <div class="footer-text">Epsilons</div>
            </div>
        </div>
    </div>

</body>
</html>
